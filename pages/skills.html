<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <title>Skills</title>
</head>
<body>

    <header class="container">
        <h1>My Skills</h1>
        <p>A quick overview of the technologies and tools I work with.</p>

    <main class="container">

        <!-- Backend -->
        <section class="skills-section">
            <h2>Backend</h2>
            <div class="skills-grid">
                <div class="skill-card">C#</div>
                <div class="skill-card">ASP.NET Core</div>
                <div class="skill-card">Entity Framework</div>
                <div class="skill-card">REST APIs</div>
                <div class="skill-card">JWT Authentication</div>
            </div>
        </section>

        <!-- Frontend -->
        <section class="skills-section">
            <h2>Frontend</h2>
            <div class="skills-grid">
                <div class="skill-card">HTML5</div>
                <div class="skill-card">CSS3</div>
                <div class="skill-card">JavaScript</div>
                <div class="skill-card">Responsive Design</div>
            </div>
        </section>

        <!-- Tools -->
        <section class="skills-section">
            <h2>Tools & Technologies</h2>
            <div class="skills-grid">
                <div class="skill-card">Git</div>
                <div class="skill-card">GitHub</div>
                <div class="skill-card">Visual Studio</div>
                <div class="skill-card">Postman</div>
            </div>
        </section>

        <!-- Extra -->
        <section class="skills-section">
            <h2>Concepts</h2>
            <div class="skills-grid">
                <div class="skill-card">MVC</div>
                <div class="skill-card">MVVM</div>
                <div class="skill-card">Clean Code</div>
                <div class="skill-card">API Integration</div>
            </div>
        </section>

    </main>

</body>
</html>
